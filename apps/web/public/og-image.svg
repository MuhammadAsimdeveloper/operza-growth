<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="1200" height="630" fill="url(#bg-gradient)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="950" cy="180" r="320" fill="url(#glow-1)" opacity="0.45" />
  <circle cx="200" cy="500" r="280" fill="url(#glow-2)" opacity="0.35" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 95)">
    <rect width="64" height="64" rx="16" fill="#4f46e5" />
    <path d="M22 22 L42 22 L42 32 L22 32 Z M22 32 L32 32 L32 42 L22 42 Z" fill="#ffffff" />
    <text x="84" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-1">OPERZA</text>
    <rect x="250" y="20" width="120" height="26" rx="13" fill="rgba(79, 70, 229, 0.25)" stroke="#6366f1" stroke-width="1" />
    <text x="310" y="37" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">GROWTH OS</text>
  </g>

  <!-- Main Value Proposition Headline -->
  <text x="100" y="260" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    The All-in-One Business Operating System
  </text>
  <text x="100" y="325" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5">
    &amp; Multi-Tenant Agency CRM
  </text>

  <!-- Subheadline -->
  <text x="100" y="395" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" line-height="32">
    Consolidate CRM pipelines, 2D visual workflows, funnels, omnichannel conversations,
  </text>
  <text x="100" y="430" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    and white-label client portals into a single high-performance platform.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 485)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="110" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Multi-Tenant Isolation</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="220" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="345" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔄 Visual Workflow Canvas</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="220" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="580" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🌐 1-Click Funnel Builder</text>

    <!-- Pill 4 -->
    <rect x="705" y="0" width="220" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="815" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">💬 Omnichannel Inbox</text>
  </g>

  <!-- URL Tag -->
  <text x="1100" y="580" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="0.5">
    operza.io
  </text>

  <!-- Definitions -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f1d" />
      <stop offset="0.6" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glow-1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 180) rotate(90) scale(320)">
      <stop stop-color="#4f46e5" />
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 500) rotate(90) scale(280)">
      <stop stop-color="#3b82f6" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
