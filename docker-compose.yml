version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: operza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: operza_db
      POSTGRES_USER: operza_admin
      POSTGRES_PASSWORD: operza_admin_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/scripts/bootstrap-roles.sql:/docker-entrypoint-initdb.d/01-bootstrap-roles.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operza_admin -d operza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: operza-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: operza-migrate
    restart: "no"
    command: ["node", "packages/db/scripts/migrate.mjs"]
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://operza_migrator:operza_migrator_secret@postgres:5432/operza_db
      - MIGRATION_DATABASE_URL=postgresql://operza_migrator:operza_migrator_secret@postgres:5432/operza_db
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: operza-worker
    restart: unless-stopped
    command: ["node", "apps/api/worker.mjs"]
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=production
      - WORKER_DATABASE_URL=postgresql://operza_worker:operza_worker_secret@postgres:5432/operza_db
      - WORKFLOW_JOB_MODULE=packages/platform-core/src/trusted-handlers.mjs
      - WORKER_ID=operza-durable-worker-1
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: operza-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://operza_app:operza_secret@postgres:5432/operza_db
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=operza-production-grade-session-secret-change-this-in-real-deployment-32chars
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: operza-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
