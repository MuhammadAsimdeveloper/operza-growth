name: Operza CI/CD Quality Gates

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
      - 'feat/**'
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # Gate 1: Static Quality, Typechecking & Workspace Unit Tests
  # ============================================================================
  static-and-unit:
    name: Gate 1: Static Quality & Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: TypeScript Typecheck Web Application
        run: npm run typecheck

      - name: Action Governance Unit Tests
        run: npm --workspace=@operza/action-governance test

      - name: Workflow Engine Unit Tests
        run: npm --workspace=@operza/workflow-engine test

      - name: Platform Core Unit Tests
        run: npm --workspace=@operza/platform-core test

      - name: Database Schema & Logic Unit Tests
        run: npm --workspace=@operza/db test

      - name: Production Vite 6 / React 19 Build
        run: npm run build

  # ============================================================================
  # Gate 2: Real PostgreSQL Relational Migrations & RLS Isolation
  # ============================================================================
  postgres-integration:
    name: Gate 2: PostgreSQL 16 Migrations & RLS
    runs-on: ubuntu-latest
    needs: [static-and-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: operza_ci_test
          POSTGRES_USER: operza_ci_admin
          POSTGRES_PASSWORD: ci_test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-cmd-interval 5s
          --health-cmd-timeout 5s
          --health-cmd-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Real PostgreSQL Migrations 001-014 & RLS Suite
        env:
          OPERZA_TEST_DATABASE_URL: postgresql://operza_ci_admin:ci_test_password_123@127.0.0.1:5432/operza_ci_test
        run: npm --workspace=@operza/db test

  # ============================================================================
  # Gate 3: Redis & Distributed Worker Resiliency
  # ============================================================================
  worker-and-redis:
    name: Gate 3: Redis 7 & Durable Worker Resiliency
    runs-on: ubuntu-latest
    needs: [static-and-unit]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-cmd-interval 5s
          --health-cmd-timeout 5s
          --health-cmd-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Worker Resiliency & Redis Failover Suite
        env:
          REDIS_URL: redis://127.0.0.1:6379
          ALLOW_IN_MEMORY_QUEUE: 'true'
        run: npm --workspace=@operza/platform-core test

  # ============================================================================
  # Gate 4: End-to-End System Integration & SEO Compliance
  # ============================================================================
  e2e-system-integration:
    name: Gate 4: End-to-End System Suite (116 Scenarios) & SEO
    runs-on: ubuntu-latest
    needs: [static-and-unit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run SEO Compliance Checks
        run: node scripts/seo-audit/run-seo-checks.mjs

      - name: Run 116 End-to-End System Scenarios
        run: node scripts/test-e2e.mjs

  # ============================================================================
  # Gate 5: Production Container Packaging & Layer Verification
  # ============================================================================
  container-builds:
    name: Gate 5: Container Multi-Stage Builds (API & Web)
    runs-on: ubuntu-latest
    needs: [static-and-unit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: operza/api:rc-candidate

      - name: Build Web Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: operza/web:rc-candidate

  # ============================================================================
  # Gate 6: Security Audit & Dependency Scanning
  # ============================================================================
  security-audit:
    name: Gate 6: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run npm audit (Production dependencies)
        run: npm audit --omit=dev --audit-level=high
