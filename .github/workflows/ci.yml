name: CI & Production Quality Gates

on:
  push:
    branches: [master, main, 'release/**', 'repair/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full Enterprise Verification (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: operza_db
          POSTGRES_USER: operza_admin
          POSTGRES_PASSWORD: operza_admin_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Check
        run: npm run typecheck

      - name: Production Bundle Compilation
        run: npm run build

      - name: Bootstrap PostgreSQL Roles & Permissions
        env:
          PGPASSWORD: operza_admin_secret
        run: |
          psql -h localhost -U operza_admin -d operza_db -f packages/db/scripts/bootstrap-roles.sql

      - name: Apply Database Migrations (001 - 008)
        env:
          MIGRATION_DATABASE_URL: postgresql://operza_migrator:operza_migrator_secret@localhost:5432/operza_db
        run: node scripts/migrate.mjs

      - name: Run Full Automated Test Suite (200 Tests: Unit, SEO, Integration, Security)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://operza_app:operza_secret@localhost:5432/operza_db
          REDIS_URL: redis://localhost:6379
          ALLOW_IN_MEMORY_QUEUE: "true"
        run: npm test

  docker-build:
    name: Verify Docker Container Production Builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API & Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: operza/api:latest

      - name: Build Web Client & Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: operza/web:latest
