name: Operza Remote Infrastructure & Build Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/**'
      - 'apps/**/Dockerfile'
      - 'docker-compose*.yml'
      - 'packages/db/**'
      - '.env.staging.example'
      - '.github/workflows/infra-validation.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'apps/**/Dockerfile'
      - 'docker-compose*.yml'
      - 'packages/db/**'
      - '.env.staging.example'
      - '.github/workflows/infra-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-a-source-quality:
    name: 'Gate A: Source Quality, Audit & Infra Static Checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm --workspace=@operza/action-governance test
      - run: npm --workspace=@operza/workflow-engine test
      - run: node --test packages/ui/test/ui.test.mjs
      - run: node scripts/validate-staging-infra.mjs

  gate-b-terraform-cli:
    name: 'Gate B: Terraform CLI Format & Validate (No Apply)'
    runs-on: ubuntu-latest
    needs: [gate-a-source-quality]
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform version
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  gate-c-infra-security:
    name: 'Gate C: Terraform Security Scan (tfsec)'
    runs-on: ubuntu-latest
    needs: [gate-b-terraform-cli]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          format: sarif
          sarif_file: tfsec-results.sarif
          soft_fail: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfsec-sarif-report
          path: tfsec-results.sarif

  gate-d-docker-and-compose:
    name: 'Gate D: Docker Compose & Container Builds (No Push)'
    runs-on: ubuntu-latest
    needs: [gate-a-source-quality]
    steps:
      - uses: actions/checkout@v4
      - run: docker version && docker compose version
      - run: docker compose config -q
      - env:
          POSTGRES_ADMIN_PASSWORD: ci_dummy_pg_password
          MIGRATION_DATABASE_URL: postgresql://operza_migrator:ci_dummy@postgres:5432/operza_staging
          APP_DATABASE_URL: postgresql://operza_app:ci_dummy@postgres:5432/operza_staging
          WORKER_DATABASE_URL: postgresql://operza_worker:ci_dummy@postgres:5432/operza_staging
          SESSION_SECRET: ci_dummy_session_secret_32_characters_minimum
          OPERZA_VAULT_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: docker compose -f docker-compose.staging.yml config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: operza/api:ci-${{ github.sha }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: operza/web:ci-${{ github.sha }}

  gate-e-f-services-bootstrap:
    name: 'Gates E & F: PostgreSQL 001-054, Redis, ClamAV, API & Worker Bootstrap'
    runs-on: ubuntu-latest
    needs: [gate-d-docker-and-compose]
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: operza_ci_staging
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_admin_password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Run Fresh Migrations 001-054 as operza_migrator
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:ci_pg_admin_password@127.0.0.1:5432/operza_ci_staging
        run: node packages/db/scripts/migrate.mjs
      - name: Run Stage 18 Hardening & 100% FORCE RLS Gate
        env:
          OPERZA_TEST_DATABASE_URL: postgresql://postgres:ci_pg_admin_password@127.0.0.1:5432/operza_ci_staging
        run: node --test packages/platform-core/test/stage-18-hardening.test.mjs
      - name: Verify API (operza_app) & Worker (operza_worker) Staging Startup + Redis
        env:
          NODE_ENV: staging
          PORT: '4025'
          HOST: '127.0.0.1'
          DATABASE_URL: postgresql://operza_app:operza_app_secret@127.0.0.1:5432/operza_ci_staging
          WORKER_DATABASE_URL: postgresql://operza_worker:operza_worker_secret@127.0.0.1:5432/operza_ci_staging
          REDIS_URL: redis://127.0.0.1:6379
          DISTRIBUTED_RATE_LIMIT_STRICT: 'true'
          SESSION_SECRET: ci_staging_session_secret_32_chars_min
          OPERZA_VAULT_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOWED_ORIGINS: http://127.0.0.1:4025
          WORKFLOW_JOB_MODULE: packages/platform-core/src/trusted-handlers.mjs
        run: |
          node apps/api/server.mjs &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4025/ready; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4025/health
          curl -sf http://127.0.0.1:4025/ready
          node apps/api/worker.mjs &
          WORKER_PID=$!
          sleep 3
          kill -0 $WORKER_PID
          kill -TERM $WORKER_PID $API_PID
          wait || true
      - name: Verify ClamAV Container EICAR Detection
        run: |
          docker run -d --name ci-clamav clamav/clamav:1.4
          for i in $(seq 1 30); do
            if docker exec ci-clamav clamdscan --ping 1 >/dev/null 2>&1; then break; fi
            sleep 5
          done
          printf 'X5O!P%%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.txt
          docker cp /tmp/eicar.txt ci-clamav:/tmp/eicar.txt
          if docker exec ci-clamav clamdscan --no-summary /tmp/eicar.txt; then
            echo "EICAR was NOT detected!"
            docker rm -f ci-clamav
            exit 1
          fi
          echo "EICAR detected cleanly by ClamAV."
          docker rm -f ci-clamav

  gate-g-regression:
    name: 'Gate G: Sequential Regression & Build Suite'
    runs-on: ubuntu-latest
    needs: [gate-a-source-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm --workspace=@operza/platform-core test
      - run: npm --workspace=@operza/api test
      - run: node scripts/test-e2e.mjs
      - run: npm run build
      - run: npm --workspace=apps/marketing run build
      - run: node scripts/seo-audit/run-seo-checks.mjs

  gate-h-summary:
    name: 'Gate H: Infrastructure Verification Summary'
    runs-on: ubuntu-latest
    needs: [gate-b-terraform-cli, gate-c-infra-security, gate-d-docker-and-compose, gate-e-f-services-bootstrap, gate-g-regression]
    if: always()
    steps:
      - run: |
          echo "## Operza Remote CI Infrastructure Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate B (Terraform CLI): ${{ needs.gate-b-terraform-cli.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate C (tfsec Security): ${{ needs.gate-c-infra-security.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate D (Docker & Compose): ${{ needs.gate-d-docker-and-compose.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gates E & F (PG 001-054, Redis, ClamAV, API/Worker): ${{ needs.gate-e-f-services-bootstrap.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate G (Regression & Builds): ${{ needs.gate-g-regression.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Note:** Validation only — zero AWS resources provisioned or deployed." >> "$GITHUB_STEP_SUMMARY"
