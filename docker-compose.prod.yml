version: '3.8'

# ==============================================================================
# Operza Production Compose Stack
# Multi-Tenant Agency CRM & Automation Infrastructure
# ==============================================================================

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  api_storage_prod:
    driver: local

services:
  # ─── Database (PostgreSQL 16 with Row-Level Security) ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: operza-prod-postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operza_db}
      POSTGRES_USER: ${POSTGRES_USER:-operza_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./packages/db/scripts/bootstrap-roles.sql:/docker-entrypoint-initdb.d/01-bootstrap-roles.sql:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Distributed Queue (Redis 7.x) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: operza-prod-redis
    restart: always
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    networks:
      - backend_net
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Unified API & Workflow Engine ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: operza-prod-api
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net
      - backend_net
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_APP_USER:-operza_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-operza_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set to at least 32 random characters}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-180}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX:-15}
    volumes:
      - api_storage_prod:/app/apps/api/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend & Ingress Reverse Proxy ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: operza-prod-web
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      api:
        condition: service_healthy
